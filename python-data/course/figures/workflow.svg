   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="357.0264" y="49.844749" transform="rotate(-0 357.0264 49.844749)">4. Analyse</text>
   </g>
   <g id="text_8">
