    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="54.324" y="49.844749" transform="rotate(-0 54.324 49.844749)">1. Ask</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="54.324" y="69.543345" transform="rotate(-0 54.324 69.543345)">a clear question</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="155.2248" y="49.844749" transform="rotate(-0 155.2248 49.844749)">2. Load</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="155.2248" y="69.543345" transform="rotate(-0 155.2248 69.543345)">files, databases</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="256.1256" y="49.844749" transform="rotate(-0 256.1256 49.844749)">3. Clean</text>
