   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="457.9272" y="49.844749" transform="rotate(-0 457.9272 49.844749)">5. Show</text>
