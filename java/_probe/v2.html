<!doctype html>
<html><head><meta charset="utf-8"><title>probe2</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script></head>
<body><pre id="log"></pre><pre id="console"></pre>
<script>
const L = document.getElementById('log');
const C = document.getElementById('console');
const log = (...a) => { L.textContent += a.join(' ') + '\n'; };
const BASE = '/app' + location.pathname.replace(/[^/]*$/, '');
const CP = BASE + 'runner-v3.jar:' + BASE + 'javac17.jar';
const enc = new TextEncoder();
let n = 0;
async function go(label, files, mode, timeout) {
  n++;
  const dir = '/str/job' + n;
  const ext = { 'Main.java': '.main', 'Check.java': '.check', 'stdin.txt': '.stdin' };
  for (const [name, text] of Object.entries(files)) cheerpOSAddStringFile(dir + ext[name], enc.encode(text));
  C.textContent = '';
  const t = performance.now();
  const rc = await cheerpjRunMain('course.Runner', CP, dir, '/files/o' + Date.now() + n, mode, String(timeout || 10000));
  log(`== ${label}: rc=${rc} ${Math.round(performance.now() - t)}ms\n` + C.textContent.trim());
}
(async () => {
  try {
    let t = performance.now();
    await cheerpjInit({ version: 17, status: 'none' });
    log('init', Math.round(performance.now() - t));
    const A = 'import java.util.*;\npublic class Main {\n  static int twice(int x) { return 2 * x; }\n  public static void main(String[] a) {\n    Scanner sc = new Scanner(System.in);\n    String name = sc.nextLine();\n    System.out.println("Hi " + name + " " + twice(21));\n  }\n}';
    await go('run1', { 'Main.java': A, 'stdin.txt': 'Ada\n' }, 'run');
    await go('run2 changed code', { 'Main.java': A.replace('"Hi "', '"Hello "'), 'stdin.txt': 'Bob\n' }, 'run');
    await go('check', { 'Main.java': A, 'stdin.txt': 'Ada\n', 'Check.java': 'import static course.T.*;\npublic class Check { public static void run() { eq(10, call("twice", 5), "twice(5)"); check(output().contains("Hi Ada 42"), "greeting"); check(runWith("Zed\\n").contains("Zed"), "rerun"); } }' }, 'check');
    await go('check fail', { 'Main.java': A.replace('2 * x', 'x + 2'), 'stdin.txt': 'Ada\n', 'Check.java': 'import static course.T.*;\npublic class Check { public static void run() { eq(10, call("twice", 5), "twice(5)"); } }' }, 'check');
    await go('compile error', { 'Main.java': 'public class Main { public static void main(String[] a) { int x = "s"; } }' }, 'run');
    await go('runtime error', { 'Main.java': 'public class Main { public static void main(String[] a) { int[] b = new int[2]; System.out.println("before"); System.out.println(b[5]); } }' }, 'run');
    await go('timeout', { 'Main.java': 'public class Main { public static void main(String[] a) { System.out.println("loop"); long i = 0; while (true) { i++; } } }' }, 'run', 3000);
    await go('after timeout', { 'Main.java': 'public class Main { public static void main(String[] a) { System.out.println("still alive"); } }' }, 'run');
    window.PROBE_DONE = true;
  } catch (e) { log('ERR', e && (e.stack || e)); window.PROBE_DONE = true; }
})();
</script></body></html>
