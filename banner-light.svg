<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Learning: SQL and Python from scratch">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e3e8ec" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#f4f6f7" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#f4f6f7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f4f6f7" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#f4f6f7"/>
  <rect width="1280" height="360" rx="20" fill="url(#g)"/>
  <rect width="1280" height="360" rx="20" fill="url(#fade)"/>

  <text x="64" y="92" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3" fill="#5b697b">FREE · HANDS-ON · RUNS IN YOUR BROWSER</text>
  <text x="60" y="186" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="800" letter-spacing="-3" fill="#16202b">Learning</text>
  <text x="64" y="236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" fill="#5b697b">Learn <tspan fill="#0e7466" font-weight="700">SQL</tspan> and <tspan fill="#2c679c" font-weight="700">Python</tspan> from scratch.</text>
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#5b697b">
    <text x="64" y="292"><tspan fill="#16202b" font-weight="700">55</tspan> lessons</text>
    <text x="190" y="292"><tspan fill="#16202b" font-weight="700">141</tspan> auto-checked exercises</text>
    <text x="442" y="292"><tspan fill="#16202b" font-weight="700">0</tspan> installs</text>
  </g>

  <g transform="translate(700 34) rotate(-3)">
    <rect width="420" height="150" rx="14" fill="#ffffff" stroke="#d8dee4"/>
    <rect width="420" height="6" rx="3" fill="#0e7466"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#16202b">
      <text x="24" y="50"><tspan fill="#0e7466" font-weight="700">SELECT</tspan> name, SUM(amount)</text>
      <text x="24" y="78"><tspan fill="#0e7466" font-weight="700">FROM</tspan> customers c</text>
      <text x="24" y="106"><tspan fill="#0e7466" font-weight="700">JOIN</tspan> orders o <tspan fill="#0e7466" font-weight="700">ON</tspan> o.customer_id = c.id</text>
      <text x="24" y="134"><tspan fill="#0e7466" font-weight="700">GROUP BY</tspan> name;</text>
    </g>
  </g>

  <g transform="translate(790 200) rotate(2.5)">
    <rect width="420" height="138" rx="14" fill="#ffffff" stroke="#d8dee4"/>
    <rect width="252" height="6" rx="3" fill="#2c679c"/>
    <rect x="252" width="168" height="6" rx="3" fill="#e8b417"/>
    <g font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="17" fill="#16202b">
      <text x="24" y="48"><tspan fill="#2c5fa8" font-weight="700">def</tspan> greet(name):</text>
      <text x="24" y="76" xml:space="preserve">    <tspan fill="#2c5fa8" font-weight="700">return</tspan> <tspan fill="#4b7a2e">f"Hello, {name}!"</tspan></text>
      <text x="24" y="114"><tspan fill="#2c5fa8" font-weight="700">print</tspan>(greet(<tspan fill="#4b7a2e">"Ada"</tspan>))</text>
    </g>
  </g>
</svg>
