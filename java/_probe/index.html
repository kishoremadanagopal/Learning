<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title>
<script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script></head>
<body><pre id="log"></pre><pre id="console"></pre>
<script>
const L = document.getElementById('log');
const log = (...a) => { L.textContent += a.join(' ') + '\n'; };
const BASE = '/app' + location.pathname.replace(/[^/]*$/, '');
const mode = location.hash.slice(1) || 'jar17';
const SRC = `public class Main {
  record P(int a, String b) {}
  public static void main(String[] args) throws Exception {
    var x = 5;
    String s = switch (x) { case 5 -> "five"; default -> "other"; };
    System.out.println("Hello " + x + " " + s + " " + new P(3, "q"));
    java.util.Scanner sc = new java.util.Scanner(System.in);
    System.out.println("read: " + (sc.hasNextLine() ? sc.nextLine() : "<none>"));
    System.err.println("this is stderr");
  }
}`;
(async () => {
  try {
    log('mode', mode, 'base', BASE);
    const v = mode === 'tools8' ? 8 : 17;
    let t = performance.now();
    await cheerpjInit({ version: v, status: 'none' });
    log('init java', v, Math.round(performance.now() - t), 'ms');
    cheerpOSAddStringFile('/str/Main.java', new TextEncoder().encode(mode === 'tools8' ? 'public class Main { public static void main(String[] a){ System.out.println("Hello java8"); } }' : SRC));
    const cp = mode === 'builtin17' ? '/files/' : (mode === 'tools8' ? BASE + 'tools.jar:/files/' : BASE + 'javac17.jar:/files/');
    for (const round of [1, 2]) {
      t = performance.now();
      const c = await cheerpjRunMain('com.sun.tools.javac.Main', cp, '/str/Main.java', '-d', '/files/');
      log('round', round, 'javac exit', c, Math.round(performance.now() - t), 'ms');
      t = performance.now();
      const r = await cheerpjRunMain('Main', '/files/');
      log('round', round, 'run exit', r, Math.round(performance.now() - t), 'ms');
    }
    log('CONSOLE >>>' + document.getElementById('console').textContent + '<<<');
    window.PROBE_DONE = true;
  } catch (e) { log('ERR', e && (e.stack || e)); window.PROBE_DONE = true; }
})();
</script></body></html>
