   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans', 'Helvetica', 'Arial', sans-serif; text-anchor: middle; fill: #1f2933" x="558.828" y="49.844749" transform="rotate(-0 558.828 49.844749)">6. Share</text>
